name: npm trusted-publisher fork precondition

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Request and inspect npm-audience OIDC token
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org")"
          TOKEN_RESPONSE="$response" node <<'NODE'
          const response = JSON.parse(process.env.TOKEN_RESPONSE);
          const payload = JSON.parse(Buffer.from(response.value.split('.')[1], 'base64url').toString());
          const safe = {
            aud: payload.aud,
            event_name: payload.event_name,
            repository: payload.repository,
            repository_id: payload.repository_id,
            workflow_ref: payload.workflow_ref,
            ref: payload.ref,
            base_ref: payload.base_ref,
            head_ref: payload.head_ref,
            runner_environment: payload.runner_environment,
          };
          console.log(JSON.stringify(safe));
          if (safe.aud !== 'npm:registry.npmjs.org') throw new Error('unexpected audience');
          if (!['pull_request', 'workflow_dispatch'].includes(safe.event_name)) throw new Error('unexpected event');
          NODE
